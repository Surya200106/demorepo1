
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Welcome Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #f093fb
      );
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 48px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(30, 20, 70, 0.25);
      backdrop-filter: blur(12px);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 auto 28px;
      max-width: 380px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    button {
      padding: 14px 26px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #6845a3;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(30, 20, 70, 0.22);
    }

    #message {
      min-height: 24px;
      margin-top: 22px;
      margin-bottom: 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon" aria-hidden="true">✨</div>

    <h1>Hello, World!</h1>

    <p>
      Welcome to my little corner of the web.
      Simple design, beautiful colors, and endless possibilities.
    </p>

    <button type="button" onclick="showMessage()">
      Click Me
    </button>

    <p id="message" aria-live="polite"></p>

  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Thanks for visiting! Have a wonderful day 💜";
    }
  </script>

</body>
</html>
